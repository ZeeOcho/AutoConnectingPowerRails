[AccessTransformers]
; Register the Power Rail open-connection manager on every blueprint hologram (§10).
; AFGBlueprintHologram::RegisterOpenConnectionManager< T >() is protected (FGBlueprintHologram.h:107).
; The same entry, for its own module class, is how Vertical Conveyor Auto-Connect registers its manager.
Friend=(Class="AFGBlueprintHologram", FriendClass="FAutoConnectingPowerRailsModule")

; §7.3 inside a Blueprint Designer: AACPRRail::Split adds its two child Rails to the Designer's
; buildable list and removes the original — AFGBuildableBlueprintDesigner::mBuildables is private
; (FGBuildableBlueprintDesigner.h:236) — but only when vanilla's own registration did not.
Friend=(Class="AFGBuildableBlueprintDesigner", FriendClass="AACPRRail")

; §10.1 / §10.2 for generated bridges: the manager reads the blueprint hologram's build space and its
; disqualifier list — AFGHologram::mBlueprintDesigner and mConstructDisqualifiers, both protected
; (FGHologram.h:776, :772), named through AFGBlueprintHologram. Read-only.
Friend=(Class="AFGBlueprintHologram", FriendClass="FACPRBlueprintTerminalManager")

; §10.6's link icon: vanilla's blueprint hologram duplicates the connection types it knows onto the preview
; and hangs the automatic-link icon on the duplicate. It duplicates none for a circuit connection, so this
; mod makes a stand-in with vanilla's own component setup, from the host's one power connection, and files
; it in mDuplicateConnectionToOriginalMap (private, FGBlueprintHologram.h:167) as vanilla's own duplicates
; are — that write is covered by the AFGBlueprintHologram entry above. The copy is archetype-copied from a
; live connection, so it arrives holding that connection's circuit id and connection arrays;
; UACPRPowerConnectionComponent::MakePreviewCopyInert empties them. Those four fields are private
; (FGCircuitConnectionComponent.h:184-203).
Friend=(Class="UFGCircuitConnectionComponent", FriendClass="UACPRPowerConnectionComponent")

; The Rail preview's length: AFGBeamHologram::mCurrentLength is the hologram's own length (private,
; FGBeamHologram.h:81, ReplicatedUsing=OnRep_CurrentLength) and the value ConfigureActor writes into the
; buildable as GetLength(); nothing else scales the preview mesh when the length is vanilla's. Read-only.
Friend=(Class="AFGBeamHologram", FriendClass="AACPRRailHologram")
